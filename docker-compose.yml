# Lance l'image de production en local : docker compose up --build
# Prérequis : un fichier .env (voir .env.example).
#
# En développement (mix phx.server), seule la base est utile :
#   docker compose up -d db
services:
  web:
    # Image publiée par le CI sur GitHub Container Registry.
    # `docker compose pull && docker compose up -d` pour lancer la dernière version,
    # `docker compose up --build` pour reconstruire depuis les sources locales.
    image: ghcr.io/fyndir/blind_mix:latest
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      PHX_SERVER: "true"
      DATABASE_URL: ecto://postgres:postgres@db/blind_mix_prod
    depends_on:
      db:
        condition: service_healthy
    # Applique les migrations au démarrage, puis lance le serveur.
    command: ["sh", "-c", "/app/bin/migrate && /app/bin/server"]
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  pgdata:
