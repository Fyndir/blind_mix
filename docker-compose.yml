# Blind Mix en production : docker compose up -d
#
# Le conteneur est autonome : sans DATABASE_URL il embarque sa propre base PostgreSQL,
# sans SECRET_KEY_BASE il génère sa clé, sans MAIL_PROVIDER la connexion se fait par
# mot de passe. Tout est conservé dans le volume `blindmix-data`.
# Les réglages optionnels se mettent dans .env (voir .env.example).
#
# En développement (mix phx.server), seule la base est utile :
#   docker compose up -d db
services:
  web:
    # Image publiée par le CI sur GitHub Container Registry.
    # `docker compose pull && docker compose up -d` pour lancer la dernière version,
    # `docker compose up -d --build` pour reconstruire depuis les sources locales.
    image: ghcr.io/fyndir/blind_mix:latest
    build: .
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    volumes:
      - blindmix-data:/data
    restart: unless-stopped

  # Base de développement, utilisée par `mix phx.server` (pas par le conteneur web).
  db:
    image: postgres:17
    profiles: ["dev"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  blindmix-data:
  pgdata:
